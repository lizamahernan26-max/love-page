<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">


<title>
梁桓伟 ❤️ 王艳茹
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;

overflow:hidden;

background:#030008;

font-family:"Microsoft YaHei";

}


canvas{

position:absolute;

left:0;
top:0;

}


#info{

position:absolute;

bottom:35px;

width:100%;

text-align:center;

color:#ffd7ea;

z-index:5;

}


.name{

font-size:30px;

text-shadow:
0 0 20px #ff4f9a;

}


.time{

margin-top:12px;

}


.word{

position:absolute;

color:
rgba(255,220,240,.65);

z-index:3;

white-space:nowrap;

}


</style>

</head>



<body>


<canvas id="canvas"></canvas>



<div id="info">


<div class="name">

梁桓伟 ❤️ 王艳茹

</div>


<div>

我们的故事开始于
2024.05.25 00:20

</div>


<div id="time" class="time">

</div>


</div>



<audio id="music"
src="pianai.mp3"
loop>
</audio>



<script>


const canvas=
document.getElementById("canvas");


const ctx=
canvas.getContext("2d");



let W,H;


function resize(){

W=
canvas.width=
innerWidth;


H=
canvas.height=
innerHeight;

}


resize();

window.onresize=resize;



//====================
// 性能自适应
//====================


let COUNT=7000;


if(
/Android|iPhone|iPad/i
.test(navigator.userAgent)
){

COUNT=4500;

}



//====================
// 3D实体粒子心脏
//====================


let particles=[];



function heart(t){


return{


x:
16*Math.pow(Math.sin(t),3),


y:
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t)


};


}



for(
let i=0;
i<COUNT;
i++
){


let t=
Math.random()
*Math.PI*2;



let fill=
Math.pow(
Math.random(),
0.45
);



let p=
heart(t);



particles.push({


x:
p.x*fill*6,


y:
-p.y*fill*6,


z:
(Math.random()-0.5)
*
80
*
fill,


size:
Math.random()*2+0.5,


phase:
Math.random()*6.28


});


}



//深度排序一次

particles.sort(
(a,b)=>a.z-b.z
);



let stars=[];


for(
let i=0;
i<300;
i++
){


stars.push({

x:Math.random(),

y:Math.random(),

r:Math.random()*1.5


});


}



let rotate=0;

let beat=0;
//====================
// 3D投影
//====================


function project(p){


let cos=
Math.cos(rotate);


let sin=
Math.sin(rotate);



let x=
p.x*cos-
p.z*sin;



let z=
p.x*sin+
p.z*cos;



let scale=
300/
(300+z);



return{


x:
W/2+
x*scale,


y:
H/2-20+
p.y*scale,


scale:scale


};


}







//====================
// 星空绘制
//====================


function drawStars(){


for(let s of stars){


ctx.fillStyle=
"rgba(255,255,255,.55)";


ctx.beginPath();


ctx.arc(

s.x*W,

s.y*H,

s.r,

0,

Math.PI*2

);


ctx.fill();


}


}







//====================
// 心脏粒子绘制
//====================



function drawHeart(){



beat+=0.08;



//心跳

let pulse=

1+
Math.sin(beat)
*
0.035;





for(
let i=0;
i<particles.length;
i++
){



let p=
particles[i];



let point=
project({


x:
p.x*pulse,


y:
p.y*pulse,


z:
p.z*pulse


});





let ratio=
i/COUNT;



//颜色渐变

let r=255;


let g;


let b;



if(ratio<0.35){


//核心红色

g=
40+
ratio*120;


b=
80+
ratio*100;



}else{


//外围粉紫

g=
90+
ratio*100;


b=
160+
ratio*90;


}





//粒子呼吸闪烁


let alpha=

0.75+
Math.sin(
beat+p.phase
)
*
0.2;




ctx.fillStyle=

`rgba(
${r},
${g},
${b},
${alpha}
)`;




// 使用矩形代替arc
// 手机性能更好


let size=
p.size*
point.scale;



ctx.fillRect(

point.x,

point.y,

size,

size

);



}



}








//====================
// 主动画
//====================


function animate(){



ctx.clearRect(

0,

0,

W,

H

);




drawStars();



rotate+=0.004;



drawHeart();



requestAnimationFrame(
animate
);



}



animate();
//====================
// 情话漂浮
//====================


const loveWords=[


"遇见你，是我这一生最幸运的事情",


"你是我的偏爱，也是我的例外",


"未来很长，希望每一步都有你",


"想陪你走过每一个春夏秋冬",


"你的笑容，是我最喜欢的风景",


"2024年5月25日，我们的故事开始",


"谢谢你出现在我的生命里",


"平凡的日子，因为你变得特别",


"想把所有浪漫都留给你",


"时间会走，但喜欢不会改变",


"希望多年以后，我们依然牵着手",


"有你的地方，就是我想去的远方",


"你让普通的每一天都有意义",


"愿我们一起看遍世界风景",


"梁桓伟 ❤️ 王艳茹"


];





function createLoveWord(){



let div=
document.createElement("div");



div.className="word";



div.innerText=

loveWords[
Math.floor(
Math.random()*loveWords.length
)
];



div.style.left=

(10+
Math.random()*75)
+
"%";



div.style.bottom="-30px";



document.body.appendChild(div);




setTimeout(()=>{


div.style.transition=
"12s linear";


div.style.transform=
"translateY(-110vh)";


div.style.opacity=0;



},100);



setTimeout(()=>{


div.remove();



},12000);



}



//正常速度

setInterval(

createLoveWord,

3000

);









//====================
// 相爱时间
//====================


const startTime=

new Date(
"2024-05-25T00:20:00"
);





function updateTime(){



let total=

Math.floor(

(Date.now()-startTime)
/1000

);




let day=

Math.floor(
total/86400
);



let hour=

Math.floor(
total%86400/3600
);



let minute=

Math.floor(
total%3600/60
);



let second=

total%60;





document
.getElementById("time")
.innerHTML=


"相爱已 "
+
day
+
" 天 "
+
hour
+
" 小时 "
+
minute
+
" 分 "
+
second
+
" 秒";



}



setInterval(

updateTime,

1000

);



updateTime();








//====================
// 微信点击播放音乐
//====================


document.addEventListener(

"click",

function(){


document
.getElementById("music")
.play()
.catch(()=>{});



}

);




</script>


</body>


</html>
