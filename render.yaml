services:
  - type: web
    name: xinwang
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --ignore-scripts && npm run check:deploy
    startCommand: npm run start:cloud
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: XINWANG_SETUP_KEY
        generateValue: true
